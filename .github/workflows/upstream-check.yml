# Weekly: takes newer upstream tags (at least 7 days old), builds and checks them, and only if
# everything passes commits the bump to main and starts the release build.
# Owner decision 2026-11-21: no manual review; the 7-day wait, the licence check and the
# unchanged-files check are the safeguards. A failure leaves main and the releases unchanged.
name: Upstream check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the release build; pushes by this workflow don't trigger it

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upstream-check.mjs
      - name: Build and check the new versions
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDS: ${{ steps.check.outputs.ids }}
        run: |
          set -euo pipefail
          npm test
          for id in $IDS; do node scripts/build.mjs "$id"; done
      - name: Commit to main and start the release build
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add bundles.yaml
          git commit -m "Upstream update: $SUMMARY"
          git push origin HEAD:main
          gh workflow run build.yml --ref main
